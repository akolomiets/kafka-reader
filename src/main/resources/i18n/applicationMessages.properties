franz.kafka.quotes = \
<html><font color=gray><i>"Paths are made by walking."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"Start with what is right rather than what is acceptable."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"What if I slept a little more and forgot about all this nonsense."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"Do not waste your time looking for an obstacle — maybe there is none."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"Anybody who preserves the ability to recognize beauty will never get old."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"Isolation is a way to know ourselves."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"It is often safer to be in chains than to be free."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"There are some things one can only achieve by a deliberate leap in the opposite direction."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"From a certain point onwards there is no longer any turning back. That is the point that must be reached."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"All language is but a poor translation."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"I never imagined that so many days would ultimately make such a small life."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"Only the moment counts. It determines life."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"There is an infinite amount of hope in the universe ... but not for us."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"Books are a narcotic."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"Simply wait, be quiet, still The world will freely offer itself to you."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"The truth is always an abyss."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"First impressions are always unreliable."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"One reads in order to ask questions"<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"There is a destination but no way there; what we refer to as way is hesitation."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"There's an infinite amount of hope but not for us."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"A book must be the axe for the frozen sea within us."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"Beyond a certain point there is no return. This point has to be reached."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"Many a book is like a key to unknown chambers within the castle of one’s own self."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"The meaning of life is that it stops."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"It's only because of their stupidity that they're able to be so sure of themselves."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"I think we ought to read only the kind of books that wound and stab us."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"I usually solve problems by letting them devour me."<br>— Franz Kafka</i></font></html>\n\
<html><font color=gray><i>"Writing is utter solitude, the descent into the cold abyss of oneself."<br>— Franz Kafka</i></font></html>
